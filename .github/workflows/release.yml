name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index
        type: choice
        required: true
        default: testpypi
        options: [testpypi, pypi]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: python-publish-${{ inputs.target || 'pypi' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - name: Require a matching version tag for PyPI
        if: (inputs.target || 'pypi') == 'pypi'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          from bondbyisin import __version__
          expected = 'refs/tags/v' + __version__
          if os.environ['RELEASE_REF'] != expected:
              raise SystemExit('Publish PyPI from the version tag ' + expected)
          PY
      - run: python -m build
      - run: python scripts/check_dist.py
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target || 'pypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the exact wheel being published
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          wheels = list(pathlib.Path('dist').glob('*.whl'))
          assert len(wheels) == 1
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])
          PY
      - name: Verify public examples and, for PyPI, authenticated access
        env:
          BOND_API_KEY: ${{ secrets.BOND_API_KEY }}
          TARGET: ${{ inputs.target || 'pypi' }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          args = [sys.executable, 'scripts/smoke.py']
          if os.environ['TARGET'] == 'pypi':
              args.append('--require-key')
          subprocess.check_call(args)
          PY
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: (inputs.target || 'pypi') == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
